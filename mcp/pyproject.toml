[project]
name = "relationos-mcp"
version = "0.1.0"
description = "RelationOS CRM as an MCP server — config-driven tools over the generic Postgres core"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
relationos-mcp = "relationos_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relationos_mcp"]
